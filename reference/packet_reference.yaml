# ============================================================================
# TRANSACTION SEQUENCE PATTERN
# ============================================================================

transaction_sequence:
  description: "Standard packet transmission pattern for applying settings"
  
  step_1:
    packet_type: "0x14"
    length: 8
    purpose: "Start marker / lock device configuration"
    sent_once: true
    mandatory: false
    notes: "Signals device that config update sequence beginning"
  
  step_2:
    packet_type: "0x15"
    length: 100
    subtype: "0x1D"
    purpose: "CFG1D settings payload"
    sent_once: true
    mandatory: true
    critical: "This is the main settings packet"
  
  step_3:
    packet_type: "0x1D"
    length: 8
    purpose: "Commit / apply settings"
    sent_once: true
    mandatory: true
    notes: "Signals device to apply the CFG1D payload from step 2"
  
  step_4:
    packet_type: "0x1E"
    length: 12
    purpose: "Finalize / handshake completion"
    sent_once: true
    mandatory: false
    notes: "Optional; provides handshake confirmation"

