# XIM MATRIX Protocol Reference
# Comprehensive packet documentation from WinDbg reverse-engineering
# All values verified through multiple packet captures
# 
# Update Strategy:
#   - Add new findings to appropriate sections
#   - Mark `tested: true` only after multiple verification captures
#   - Preserve capture context (WinDbg session logs) for audit trail
#   - Tag with discovery date and interception point

metadata:
  device: "XIM MATRIX"
  firmware: "Unknown"
  capture_date: "April 2026"
  interception_point: "Windows_Devices_Bluetooth!GattCharacteristic::WriteValueInternal"
  interception_address: "0x00007fffe8ad08fc"
  payload_pointer_offset: "0x50"
  payload_length_offset: "0x58"
  notes: "All constants verified via packet capture; bounds validated to prevent heap corruption"

# ============================================================================
# PACKET STRUCTURE (CFG1D - Type 0x15, Subtype 0x1D)
# ============================================================================

packet_structure:
  cfg1d:
    type: "0x15"
    subtype: "0x1D"
    length: "0x64"  # 100 bytes (valid range 0x00-0x63, off-by-one causes heap corruption)
    description: "Settings/configuration commit packet"
    
  field_map:
    header:
      offset: "0x00"
      size: 1
      value: "0x15"
      purpose: "Packet type identifier"
      tested: true
    
    subtype_field:
      offset: "0x01"
      size: 1
      value: "0x1D"
      purpose: "CFG1D settings commit marker"
      tested: true
    
    reserved_1:
      offset: "0x02-0x03"
      size: 2
      value: "Unknown"
      purpose: "Reserved/padding"
      tested: false
    
    integrity_checksum:
      offset: "0x04-0x07"
      size: 4
      value: "Unknown algorithm"
      purpose: "Protection/validation bytes"
      notes: "Algorithm unknown; PATCH STRATEGY: DO NOT MODIFY"
      tested: false
      importance: "Low - left untouched during patching"
    
    legacy_field:
      offset: "0x08"
      size: 1
      value: "0x01"
      purpose: "Legacy/compatibility field"
      tested: true
      notes: "Always observed as 0x01 in all captures"
    
    unknown_padding_1:
      offset: "0x09-0x4E"
      size: 70
      value: "Mixed"
      purpose: "Unknown/padding"
      tested: false
    
    smart_action_mode:
      offset: "0x4F"
      size: 1
      purpose: "Macro/smart action activation mode selector"
      tested: true
      importance: "High"
      values:
        - value: "0xC0"
          meaning: "Active (always)"
          description: "Smart actions always active"
        - value: "0xD0"
          meaning: "Hip Only"
          description: "Smart actions active only in hip-fire state"
        - value: "0xE0"
          meaning: "ADS Only"
          description: "Smart actions active only in aim-down-sights"
        - value: "0xF0"
          meaning: "Inactive"
          description: "Smart actions disabled"
    
    unknown_padding_2:
      offset: "0x50-0x55"
      size: 6
      value: "Mixed"
      purpose: "Unknown/padding"
      tested: false
    
    aim_curve_preset:
      offset: "0x56-0x57"
      size: 2
      purpose: "Aim sensitivity curve selection"
      tested: true
      importance: "High"
      notes: "2-byte signature; uniquely identifies curve preset"
      presets:
        preset_1:
          signature: "[0x06, 0x0D]"
          tested: true
        preset_2:
          signature: "[0x88, 0x13]"
          tested: true
        preset_3:
          signature: "[0x06, 0x0D]"
          tested: true
          notes: "Appears identical to Preset 1; possible duplicate or error"
        preset_4:
          signature: "[0x49, 0x25]"
          tested: true
        custom:
          signature: "Unknown (point-based encoding)"
          tested: false
          notes: "Custom curve encoding not yet reverse-engineered"
    
    unknown_padding_3:
      offset: "0x58-0x5D"
      size: 6
      value: "Mixed"
      purpose: "Unknown/padding"
      tested: false
    
    input_mode:
      offset: "0x5E"
      size: 1
      purpose: "Output device selection (CRITICAL)"
      tested: true
      importance: "Critical"
      notes: "Changes device controller type emulation"
      values:
        - value: "0x01"
          mode: "Xbox/PC Controller"
          description: "Standard Xbox Controller mode"
        - value: "0x02"
          mode: "PlayStation 5"
          description: "PS5 DualSense controller mode"
        - value: "0x03"
          mode: "PC XInput"
          description: "PC-native XInput mode"
        - value: "0x04"
          mode: "Mouse + Keyboard"
          description: "Pure Mouse and Keyboard output (MnK forces rate tier 0x03)"
        - value: "0x05"
          mode: "Controller + Mouse & Keyboard"
          description: "Hybrid mode - controller + MnK simultaneous output (forces rate tier 0x03)"
    
    output_rate_tier:
      offset: "0x5F"
      size: 1
      purpose: "Output polling frequency tier (CRITICAL)"
      tested: true
      importance: "Critical"
      notes: "Some modes (MnK, hybrid) ignore user selection and force tier 0x03"
      values:
        - value: "0x00"
          rate: "Standard"
          hz: "60ms (approx 16.7Hz)"
          used_in_modes: ["xbox", "ps5", "xinput"]
        - value: "0x01"
          rate: "250Hz"
          hz: "4ms (250Hz polling)"
          used_in_modes: ["xbox", "ps5", "xinput"]
        - value: "0x02"
          rate: "500Hz"
          hz: "2ms (500Hz polling)"
          used_in_modes: ["xbox", "ps5", "xinput"]
        - value: "0x03"
          rate: "1000Hz"
          hz: "1ms (1000Hz polling)"
          used_in_modes: ["xbox", "ps5", "xinput", "mnk", "hybrid"]
    
    unknown_padding_4:
      offset: "0x60-0x6C"
      size: 13
      value: "Mixed"
      purpose: "Unknown/padding"
      tested: false
    
    companion_code:
      offset: "0x6D"
      size: 1
      purpose: "Mode/rate synchronization code (CRITICAL)"
      tested: true
      importance: "Critical"
      notes: "Must match current mode/rate pair; mismatch causes device rejection. Per-pair unique values."
      atomicity: "MUST be updated atomically with offset 0x5E and 0x5F"
      examples:
        - mode: "xbox"
          rate: "standard"
          companion_code: "0x61"
        - mode: "ps5"
          rate: "standard"
          companion_code: "0x15"
        - mode: "xinput"
          rate: "standard"
          companion_code: "0x31"
        - mode: "mnk"
          rate: "any"
          companion_code: "0x32"
        - mode: "hybrid"
          rate: "any"
          companion_code: "0xF3"
    
    padding_end:
      offset: "0x6E-0x63"
      size: 16
      value: "Mixed"
      purpose: "End padding/potential checksum"
      tested: false

