# ============================================================================
aim_settings:
  status: "◐"
  completion: 30
  items:
    - name: "Aim Curve Presets"
      description: "Pre-configured aim response curves (separate selectors for Hip and ADS)"
      priority: "High"
      packet_type: "0x15 (curve-specific variant)"
      status: "◐"
      tested: true
      offset: "Variant-dependent (signature/payload region observed around 0x40+ in ADS subtype 0x00 len=0x64 captures)"
      presets_found: 4
      capture_notes: "Capture Hip and ADS independently: for each section select presets 1-4 and record variant/signature bytes and any extended point payload. Use UI preset index left->right to avoid naming ambiguity from icon shape differences."
      notes: "Clean no-restart sweep (Hip 1->4, then ADS 1->4) showed consistent preset family order in both contexts: Preset1=`88 13 88 13`, Preset2=`06 0D 00 00`, Preset3=`49 25 1B 0A ...` (extended), Preset4=`3F 12 54 06 ...` (extended). Extended families may emit companion packets carrying continuation data."
      sub_items:
        - name: "Preset 1"
          status: "✓"
          signature: "[0x88, 0x13, 0x88, 0x13]"
          verified: true
        - name: "Preset 2"
          status: "✓"
          signature: "[0x06, 0x0D, 0x00, 0x00]"
          verified: true
        - name: "Preset 3"
          status: "✓"
          signature: "[0x49, 0x25, 0x1B, 0x0A, ...]"
          verified: true
          notes: "Extended payload family; often followed by continuation/companion packet depending on context and save timing."
        - name: "Preset 4"
          status: "✓"
          signature: "[0x3F, 0x12, 0x54, 0x06, ...]"
          verified: true
          notes: "Rightmost preset button (last preset) in UI; extended payload family and can emit continuation companion packet."
        - name: "Custom Curve"
          status: "⚠"
          description: "Point-based encoding detected; full algorithm pending"
          blocked_by: "Incomplete algorithm reverse-engineering"
          priority: "Phase 3"
          notes: "Mode selection likely toggles behavior flag bytes in subtype 0x00 packets (observed @0x38: native=0x00, custom=0x01; separate hip-path toggle observed @0x4E). Control-point encoding still unknown. Validate whether Hip and ADS custom curves are separate payload regions or shared schema with context selector."
    
    - name: "Curve Editor / Custom Curve Points"
      description: "Manual curve point adjustment"
      priority: "High"
      packet_type: "0x15 (curve variant, extended data)"
      status: "⚠"
      notes: "Partial data observed; appears to use extended payload structure. ADS custom drag run (from Preset1 baseline) changed candidate control bytes at 0x42/0x43, 0x46/0x47, and occasionally 0x3E/0x3F while sensitivity bytes remained fixed; 0x2710 behaves like 100.0 in curve domain. Additional ADS Tool1 test from Preset4 (drag top-right point to x=1.000,y=0.000) changed subtype-0x08 front table bytes at 0x12/0x13 and 0x16/0x17 to 0x0000 while 0x14/0x15 remained 0x2710, supporting coordinate tuple encoding in the 0x0C+ table. ADS Tool1 bottom-left drag-across test showed apparent UI saturation/clamp (point stopped mid) with controlled tuple update (`3f 12 54 06 -> 3f 12 0e 02`) and movement-state change (`0x0000 -> 0x004F`). ADS Tool1 second-point left-drag test rewrote a localized early/mid tuple segment while keeping downstream tuples stable, supporting neighborhood-local coordinate updates. ADS Tool2 square-segment edit from Preset4 changed extended tuple bytes from `57 13 69 09 7A 13` to `20 13 10 27 7A 13`, indicating selected pair rewrite with y pushed to max. ADS Tool3 (linearize) run from Preset4 preserved early tuple region but rewrote late tuple fields near `...64 14 6B 14 ...`, including forcing multiple paired values to `0x0000` in stronger linearized state. ADS Tool4 run (remove-handle mode, rightward drag) preserved sensitivity and early tuples while progressively rewriting late tuple fields with occasional paired zeroing. Hip Tool1 mirrors now include endpoint up-drag, interior constrained motion, baseline-left rewrite, and clean right-permissive confirmation. Hip Tool2 H-T2-W01 captured under right-wall constraint still produced the expected local square-shaping rewrite in the companion tuple region (`...6B14 FA14 9915 001D...` -> `...6B14 001D 9615 001D...`). Hip Tool3 candidate H-T3-W01 captured from Preset4 with right-wall/down/top path: tuple family stayed stable, late tuple region rewrote through a temporary degenerate state (`...7A13 0000 ...`) and reached max-bound values (`0x2710`) in final state; confidence marked mixed-action due to multi-step movement in one window. Hip Tool4 now has both crash-contaminated and crash-free runs; crash-free H-T4-W02 captured explicit point deletion followed by post-delete constrained movement, confirming topology change handling within the same known tuple schema. UI tool modes are now clarified: Tool1=free handle drag, Tool2=flat/square segment shaping, Tool3=linearize selected points, Tool4=remove handles."
      capture_notes: "For Hip then ADS: (1) switch to Custom, (2) capture untouched linear baseline, (3) choose one tool mode at a time (Tool1-Tool4), (4) apply exactly one edit, (5) capture immediately, (6) compare against baseline and preset captures to isolate point-array encoding and context-selector bytes, focusing on subtype-0x08 front table region, mid extended tuple region, and late tuple region near `...64 14 6B 14 ...`. If one-step drags are impractical, use coarse anchor moves (Y 0->100 and Y 100->0) with pre/post captures and mark run as coarse in notes."
      expected_structure: "Point array format: [x, y] coordinates or similar"
      tool3_followup: "H-T3-W02 repeat captured under strong horizontal constraint (slight down-angle only): companion tuple region changed locally (`...6B14 BD1C...` -> `...6B14 9F1C...`) while sensitivity bytes remained fixed; supports Tool3 region stability."
      tool4_followup: "H-T4-W01 (crash/reconnect) established regional progression; H-T4-W02 crash-free canonical polish captured explicit point deletion and post-delete constrained movement in the same schema."
      tool4_delete_repeat: "H-T4-W03 delete-only run (no post-delete movement) reproduced the same deletion transition pattern, confirming deletion offsets are stable and not movement-dependent. Attempting multi-delete in one pass appeared UI-state constrained."
      tool2_followup: "H-T2-W01 captured with wall constraint and slight rightward progress; companion tuple rewrite matched expected Tool2 local square-shaping neighborhood. Optional H-T2-W02 clean unconstrained pass only if strict canonical geometry trace is needed."
      tool1_followup: "H-T1-W03 showed left progression with right block at one point; H-T1-W04 clean right-permissive confirmation captured expected same-region companion rewrite (`...6B14 FA14 9915 001D...` -> `...6B14 001D E212 001D...`), confirming dual-direction capability is point-local geometry constrained, not protocol-constrained."
      next_action: "Required Hip custom-curve evidence set is complete, including Tool1 dual-direction confirmation. Close Hip curve schema mapping and consolidate final shared-schema notes for transition to next capture phase."
    
    - name: "Hip Sensitivity"
      description: "X/Y sensitivity multiplier for hip-fire"
      priority: "High"
      packet_type: "0x15 (subtype 0x00 observed in current firmware path, len=0x64)"
      status: "✓"
      notes: "Confirmed Hip mapping: X axis @0x4A, Y axis @0x4C (unlock test verified independent movement). Encoding is uint16 little-endian fixed-point: value = display*10 (e.g., 73.0->0x02DA, 74.0->0x02E4). Boundary sweeps confirm both Hip axes clamp at 0.0 -> 100.0 (0x0000 -> 0x03E8). Hip X decimal sweep 73.0->73.9 serialized as 0x02DA->0x02E3 and Hip Y decimal sweep 100.0->99.1 serialized as 0x03E8->0x03DF (+/-0x0001 per 0.1). Offset 0x02 appears sequence-like; 0x04-0x07 appear volatile integrity/session fields."
      capture_notes: "Use subtype 0x00, len 0x64 packet path. Track 0x4A/0x4C as semantic value bytes and exclude 0x02 and 0x04-0x07 from semantic diffs. +1.0 UI step = +0x000A."
      expected_range: "0.1x to 10x multiplier"
      next_action: "Mapped for current firmware path; optional spot-check at nontrivial decimals (e.g., 12.3, 57.8)"
    
    - name: "ADS Sensitivity"
      description: "X/Y sensitivity multiplier for aim-down-sights"
      priority: "High"
      packet_type: "0x15 (subtype 0x00 observed in current firmware path, len=0x64)"
      status: "✓"
      notes: "Confirmed ADS mapping: X axis @0x34, Y axis @0x36 (unlock test verified independent movement). Encoding matches Hip: uint16 little-endian fixed-point value = display*10 (e.g., 41.0->0x019A, 42.0->0x01A4). ADS clamps confirmed on both axes at 0.0 -> 100.0 (0x0000 -> 0x03E8). ADS X decimal sweep 1.0->1.9 serialized as 0x000A->0x0013 and ADS Y decimal sweep 0.0->0.9 serialized as 0x0000->0x0009 (+0x0001 per 0.1). Offset 0x38 toggles with behavior mode (native=0x00, custom=0x01)."
      capture_notes: "Use subtype 0x00, len 0x64 packet path. Treat 0x02 and 0x04-0x07 as volatile sequence/integrity fields and exclude from semantic diffing. +1.0 UI step = +0x000A."
      expected_range: "0.1x to 10x multiplier"
      next_action: "Mapped for current firmware path; optional spot-check at nontrivial decimals (e.g., 12.3, 57.8)"
      activation_delay_followup: "Closed by explicit isolated ADS-page windows: Activate-only 0->2->0 and Deactivate-only 0->2->0. Activate delay is metadata-family tail uint16 at 0x62/0x63 (`... 02 00 01 00 -> 02 00 02 00 -> 02 00 01 00 -> 02 00 00 00`), and Deactivate delay is control-family uint32 at 0x0C..0x0F (`0x00000001 -> 0x00000002 -> 0x00000001 -> 0x00000000`). Prior marker typo caveat is retired."
    
    - name: "Velocity Calibration"
      description: "Per-axis mouse velocity calibration data"
      priority: "Medium"
      packet_type: "0x15 (subtype 0x08 observed, calibration-specific)"
      status: "⚠"
      tested: false
      blocked_by: "Requires hardware source (mouse/controller) connected"
      notes: "Packets only sent when input device actively connected; impossible without hardware"
      capture_notes: "Connect mouse or controller to PC, trigger velocity calibration in XIM Manager, capture 0x15 packets"
      sub_items:
        - name: "Calibration X Axis"
          status: "⚠"
          priority: "Medium"
          blocked_by: "Hardware requirement"
        - name: "Calibration Y Axis"
          status: "⚠"
          priority: "Medium"
          blocked_by: "Hardware requirement"
        - name: "Hip Calibration State"
          status: "⚠"
          priority: "Low"
        - name: "ADS Calibration State"
          status: "⚠"
          priority: "Low"
        - name: "Calibration Reset"
